<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="LifePlay - ブラウザで遊べる3Dオープンワールド生活RPG" />
    <title>LifePlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===== タイトル ===== -->
    <section id="screen-title" class="screen title-screen hidden">
      <div class="title-bg"></div>
      <div class="title-card">
        <span class="eyebrow">OPEN WORLD LIFE RPG</span>
        <h1>LifePlay</h1>
        <p class="tagline">町で働き、畑を耕し、海で釣り、森で冒険する。<br />あなただけのもう一つの暮らし。</p>
        <div class="title-buttons">
          <button id="btn-new" class="primary big">はじめから</button>
          <button id="btn-continue" class="big">つづきから</button>
        </div>
        <p class="hint">PC: WASD移動 / マウスで視点　スマホ: 左スティック移動 / 右側ドラッグで視点</p>
      </div>
    </section>

    <!-- ===== キャラクター作成 ===== -->
    <section id="screen-create" class="screen create-screen hidden">
      <div class="create-layout">
        <div class="create-preview">
          <div id="preview"></div>
          <p class="hint">ドラッグで回転</p>
        </div>
        <div class="create-form">
          <h2>キャラクター作成</h2>
          <label class="field">
            <span>名前</span>
            <input id="name-input" type="text" maxlength="10" value="ユウ" autocomplete="off" />
          </label>
          <div class="field">
            <span>髪型</span>
            <div class="seg">
              <button data-style="short">ショート</button>
              <button data-style="long">ロング</button>
            </div>
          </div>
          <div class="field"><span>髪の色</span><div id="hair-list" class="swatches"></div></div>
          <div class="field"><span>肌の色</span><div id="skin-list" class="swatches"></div></div>
          <div class="field"><span>服の色</span><div id="outfit-list" class="swatches"></div></div>
          <div class="field"><span>職業</span><div id="job-list" class="jobs"></div></div>
          <div class="create-buttons">
            <button id="btn-back">戻る</button>
            <button id="btn-random">おまかせ</button>
            <button id="btn-start" class="primary">この姿で始める</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== ゲーム ===== -->
    <section id="screen-game" class="screen hidden">
      <div id="game-root"></div>
      <div id="vignette"></div>
      <div id="fade"></div>

      <div id="hud">
        <!-- 左上: ステータス -->
        <div class="hud-card status">
          <div class="who"><b id="hud-name">-</b><span id="hud-job">-</span></div>
          <div class="bar hp" id="bar-hp"><label>HP</label><div><i></i></div><b>-</b></div>
          <div class="bar energy" id="bar-energy"><label>ST</label><div><i></i></div><b>-</b></div>
          <div class="bar hunger" id="bar-hunger"><label>満腹</label><div><i></i></div><b>-</b></div>
          <div class="money">💰 <b id="hud-money">0</b> G</div>
        </div>

        <!-- 右上: ミニマップ一体型パネル -->
        <div class="hud-card mapcard">
          <div class="map-head">
            <b id="hud-location">-</b>
            <span id="hud-time">-</span>
          </div>
          <div class="map-wrap" title="M で全体地図">
            <canvas id="minimap" width="190" height="190"></canvas>
          </div>
          <div class="map-foot"><span id="hud-day">-</span><span id="hud-coords"></span></div>
          <div class="quest-track">
            <h5>📜 今日の依頼</h5>
            <ul id="hud-quests"></ul>
          </div>
        </div>

        <!-- 左下: ログ -->
        <div class="hud-card log"><div id="log-list"></div></div>

        <!-- 中央: インタラクション -->
        <div id="prompt" class="hidden"></div>
        <div id="toast"></div>

        <!-- 下中央: ホットバー -->
        <div class="hotbar">
          <button data-hot="interact"><kbd>E</kbd>調べる</button>
          <button data-hot="attack"><kbd>F</kbd>攻撃</button>
          <button data-hot="eat"><kbd>1</kbd>食べる</button>
          <button data-hot="menu"><kbd>I</kbd>メニュー</button>
          <button data-hot="map"><kbd>M</kbd>地図</button>
          <button data-hot="save"><kbd>K</kbd>セーブ</button>
        </div>

        <div id="joystick"><i></i></div>
      </div>

      <!-- メニュー -->
      <div id="panel-menu" class="panel hidden">
        <div class="panel-head">
          <nav class="tabs">
            <button data-tab="items">持ち物</button>
            <button data-tab="skills">スキル</button>
            <button data-tab="people">住人</button>
            <button data-tab="quests">依頼</button>
            <button data-tab="help">操作</button>
            <button data-tab="system">システム</button>
          </nav>
          <button class="close" data-close>✕</button>
        </div>
        <div id="menu-body" class="panel-body"></div>
      </div>

      <!-- 会話 -->
      <div id="panel-dialog" class="dialog hidden">
        <div id="dialog-name"></div>
        <p id="dialog-text"></p>
        <div id="dialog-options"></div>
      </div>

      <!-- 建物 -->
      <div id="panel-building" class="panel hidden">
        <div class="panel-head"><h3 id="building-name"></h3><button class="close" data-close>✕</button></div>
        <div id="building-body" class="panel-body"></div>
      </div>

      <!-- 全体地図 -->
      <div id="panel-map" class="panel map-panel hidden">
        <div class="panel-head"><h3>🗺 ワールドマップ</h3><button class="close" data-close>✕</button></div>
        <canvas id="worldmap" width="640" height="640"></canvas>
      </div>
    </section>

    <div id="fatal" class="hidden"><div><h2>起動できませんでした</h2><p></p><button onclick="location.reload()">再読み込み</button></div></div>

    <script src="vendor/three.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/world.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
